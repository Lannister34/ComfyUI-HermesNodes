[project]
name = "comfyui-hermes-nodes"
description = "WAN 2.2 dual-model LoRA loader and samplers, image prep helpers, and in-graph video preview/compare for ComfyUI"
version = "1.2.0"
license = { file = "LICENSE" }
# torch, numpy, Pillow, av and aiohttp all come with ComfyUI itself
dependencies = []

[project.urls]
Repository = "https://github.com/Lannister34/ComfyUI-HermesNodes"
"Bug Tracker" = "https://github.com/Lannister34/ComfyUI-HermesNodes/issues"

[tool.comfy]
PublisherId = "lannister34"
DisplayName = "Hermes Nodes"
Icon = ""

[tool.pytest.ini_options]
# The package root has an __init__.py, so pytest would treat the repo as a test package and import
# that file as a bare module named "__init__" (the folder name is not an identifier). Cutting the
# collection tree at tests/ keeps the node pack out of it; conftest.py imports it properly.
addopts = "--confcutdir=tests -p no:cacheprovider"
testpaths = ["tests"]
